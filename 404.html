<style>
  :root {
    --bg: #FAFAFC;
    --surface: #FFFFFF;
    --ink: #0A0A1A;
    --ink-soft: #475569;
    --ink-muted: #94A3B8;
    --line: #E5E7EB;
    --primary: #2563EB;
    --primary-soft: #DBEAFE;
    --primary-deep: #1D4ED8;
    --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
    --radius-sm: 12px;
    --radius-md: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  header.site {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    max-width: 1180px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 18px; letter-spacing: -0.4px;
  }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #2563EB 0%, #8B5CF6 50%, #EC4899 100%);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 14px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }
  .brand span { color: var(--ink-muted); font-weight: 600; }

  main {
    flex: 1;
    max-width: 720px; margin: 0 auto; padding: 72px 24px 96px;
    text-align: center;
  }
  .code {
    font-size: 88px; font-weight: 800; letter-spacing: -4px; line-height: 1;
    background: linear-gradient(135deg, #2563EB 0%, #8B5CF6 50%, #EC4899 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 12px;
  }
  h1 { font-size: 26px; letter-spacing: -0.6px; margin: 0 0 10px; }
  .lead { color: var(--ink-soft); font-size: 16px; margin: 0 0 36px; }
  .home-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary); color: #fff;
    font-weight: 700; font-size: 15px;
    padding: 14px 28px; border-radius: 999px;
    box-shadow: 0 12px 36px rgba(37, 99, 235, 0.18);
    transition: background .15s ease;
  }
  .home-btn:hover { background: var(--primary-deep); }

  .tools {
    margin-top: 56px; text-align: left;
  }
  .tools h2 {
    font-size: 14px; font-weight: 700; color: var(--ink-muted);
    letter-spacing: 0.4px; margin: 0 0 14px; text-align: center;
  }
  .tool-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
  }
  .tool-grid a {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 13px 16px;
    font-size: 14px; font-weight: 600; color: var(--ink-soft);
    box-shadow: var(--shadow-md);
    transition: border-color .15s ease, color .15s ease;
  }
  .tool-grid a:hover { border-color: var(--primary); color: var(--primary); }

  footer {
    border-top: 1px solid var(--line);
    padding: 24px; text-align: center;
    color: var(--ink-muted); font-size: 13px;
  }
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="머리카락 빨리 기르는 방법 샴푸로 감는 방법하나 바꿨을 뿐인데">
  <defs>

  <text x="96" y="249" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="55" font-weight="800" fill="#fff" letter-spacing="-1">머리카락 빨리 기르는 방법</text>
  <text x="96" y="315" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="55" font-weight="800" fill="#fff" letter-spacing="-1">샴푸로 감는 방법하나 바꿨을</text>
